<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pink Daily Journal & Planner 🌸</title>
    <!-- Font Quicksand & Pacifico dễ thương -->
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --pink-main: #ff85a2;
            --pink-light: #fde2e4;
            --pink-soft: #fff0f3;
            --pink-accent: #ff477e;
            --pink-dark: #702963;
            --text-color: #5c3d46;
            --shadow-soft: 0 10px 25px rgba(255, 133, 162, 0.2);
            --radius-main: 24px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Quicksand', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #fff5f7;
            background-image: 
                radial-gradient(#ffb3c1 1.5px, transparent 1.5px), 
                radial-gradient(#ffb3c1 1.5px, #fff5f7 1.5px);
            background-size: 60px 60px;
            background-position: 0 0, 30px 30px;
            color: var(--text-color);
            min-height: 100vh;
            padding: 20px 15px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            position: relative;
            overflow-x: hidden;
        }

        /* Bong bóng / Trái tim trôi nền */
        .bg-decor {
            position: fixed;
            pointer-events: none;
            z-index: 0;
            font-size: 2rem;
            animation: floatSlow 8s infinite ease-in-out alternate;
            opacity: 0.6;
        }
        .decor-1 { top: 5%; left: 3%; animation-delay: 0s; }
        .decor-2 { top: 20%; right: 4%; animation-delay: 2s; }
        .decor-3 { bottom: 10%; left: 5%; animation-delay: 4s; }
        .decor-4 { bottom: 15%; right: 6%; animation-delay: 1s; }

        @keyframes floatSlow {
            0% { transform: translateY(0px) rotate(0deg); }
            100% { transform: translateY(-20px) rotate(15deg); }
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(10px);
            border-radius: var(--radius-main);
            border: 4px solid #fff;
            box-shadow: var(--shadow-soft);
            padding: 30px 25px;
            position: relative;
            z-index: 1;
        }

        /* Header Cute */
        header {
            text-align: center;
            margin-bottom: 25px;
            position: relative;
        }

        .title {
            font-family: 'Pacifico', cursive;
            color: var(--pink-accent);
            font-size: 2.4rem;
            text-shadow: 2px 2px 0px #fff, 4px 4px 0px var(--pink-light);
            margin-bottom: 5px;
        }

        .subtitle {
            font-size: 0.95rem;
            color: #b56576;
            font-weight: 600;
        }

        /* Bộ điều khiển tháng */
        .month-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--pink-light);
            padding: 12px 20px;
            border-radius: 50px;
            margin-bottom: 25px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.03);
        }

        .month-btn {
            background: white;
            border: 2px solid var(--pink-main);
            color: var(--pink-accent);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            box-shadow: 0 4px 8px rgba(255,133,162,0.2);
        }

        .month-btn:hover {
            transform: scale(1.15) rotate(5deg);
            background: var(--pink-main);
            color: white;
        }

        .month-display {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--pink-dark);
            letter-spacing: 0.5px;
        }

        .btn-today {
            background: var(--pink-main);
            color: white;
            border: none;
            padding: 6px 15px;
            border-radius: 20px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s ease;
            box-shadow: 0 3px 6px rgba(255,71,126,0.3);
        }
        .btn-today:hover {
            background: var(--pink-accent);
            transform: translateY(-2px);
        }

        /* Thống kê tháng ngắn */
        .stats-bar {
            display: flex;
            justify-content: space-around;
            background: var(--pink-soft);
            border: 2px dashed var(--pink-main);
            border-radius: 16px;
            padding: 12px;
            margin-bottom: 25px;
            font-size: 0.9rem;
            font-weight: 600;
        }
        .stat-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Lịch Tháng (Calendar Grid) */
        .calendar-weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
            text-align: center;
            font-weight: 700;
            color: var(--pink-accent);
            margin-bottom: 10px;
        }

        .calendar-days {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 10px;
        }

        .day-card {
            background: white;
            border: 2px solid #ffe5ec;
            border-radius: 18px;
            min-height: 95px;
            padding: 8px 6px;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
        }

        .day-card:hover {
            transform: translateY(-5px) scale(1.03);
            border-color: var(--pink-main);
            box-shadow: 0 8px 15px rgba(255, 133, 162, 0.25);
        }

        .day-card.empty {
            background: transparent;
            border: none;
            cursor: default;
        }
        .day-card.empty:hover {
            transform: none;
            box-shadow: none;
        }

        .day-number {
            font-weight: 700;
            font-size: 1rem;
            color: var(--text-color);
            width: 26px;
            height: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }

        .day-card.today .day-number {
            background: var(--pink-accent);
            color: white;
            box-shadow: 0 2px 6px rgba(255, 71, 126, 0.4);
        }

        .day-info {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .day-mood {
            font-size: 1.3rem;
            line-height: 1;
        }

        .task-badge {
            background: var(--pink-light);
            color: var(--pink-dark);
            font-size: 0.7rem;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 10px;
            max-width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* MODAL / POPUP GHI CHÉP HÀNG NGÀY */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(92, 61, 70, 0.4);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            padding: 15px;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-card {
            background: #fff;
            width: 100%;
            max-width: 550px;
            border-radius: 28px;
            border: 4px solid var(--pink-light);
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
            padding: 25px;
            max-height: 90vh;
            overflow-y: auto;
            transform: scale(0.8);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }

        .modal-overlay.active .modal-card {
            transform: scale(1);
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: var(--pink-light);
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 1.1rem;
            color: var(--pink-accent);
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        .close-btn:hover {
            background: var(--pink-accent);
            color: white;
            transform: rotate(90deg);
        }

        .modal-header {
            margin-bottom: 20px;
        }

        .modal-date-title {
            color: var(--pink-accent);
            font-size: 1.4rem;
            font-weight: 700;
        }

        /* Chọn Mood */
        .section-label {
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--pink-dark);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .mood-selector {
            display: flex;
            justify-content: space-between;
            background: var(--pink-soft);
            padding: 10px;
            border-radius: 16px;
            margin-bottom: 20px;
        }

        .mood-btn {
            background: transparent;
            border: 2px solid transparent;
            font-size: 1.6rem;
            padding: 5px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .mood-btn:hover, .mood-btn.selected {
            background: white;
            border-color: var(--pink-main);
            transform: scale(1.25);
            box-shadow: 0 4px 10px rgba(255, 133, 162, 0.3);
        }

        /* Danh sách hoạt động (Tasks) */
        .task-input-group {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        .task-input {
            flex: 1;
            padding: 10px 16px;
            border: 2px solid var(--pink-light);
            border-radius: 50px;
            outline: none;
            font-size: 0.95rem;
            transition: 0.2s;
        }

        .task-input:focus {
            border-color: var(--pink-main);
        }

        .btn-add-task {
            background: var(--pink-main);
            color: white;
            border: none;
            padding: 0 18px;
            border-radius: 50px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-add-task:hover {
            background: var(--pink-accent);
            transform: scale(1.05);
        }

        .task-list {
            list-style: none;
            margin-bottom: 20px;
            max-height: 180px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .task-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--pink-soft);
            padding: 8px 14px;
            border-radius: 12px;
            margin-bottom: 6px;
            transition: 0.2s;
        }

        .task-item.completed span {
            text-decoration: line-through;
            opacity: 0.6;
        }

        .task-left {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        .checkbox-custom {
            width: 18px;
            height: 18px;
            border: 2px solid var(--pink-main);
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
        }

        .task-item.completed .checkbox-custom {
            background: var(--pink-accent);
            border-color: var(--pink-accent);
        }

        .task-item.completed .checkbox-custom::after {
            content: '✓';
            color: white;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .delete-task-btn {
            background: none;
            border: none;
            color: #ff477e;
            cursor: pointer;
            font-size: 1.1rem;
            opacity: 0.7;
            transition: 0.2s;
        }
        .delete-task-btn:hover {
            opacity: 1;
            transform: scale(1.2);
        }

        /* Ghi chú nhật ký */
        .journal-textarea {
            width: 100%;
            height: 90px;
            border: 2px solid var(--pink-light);
            border-radius: 16px;
            padding: 12px;
            font-size: 0.95rem;
            outline: none;
            resize: none;
            margin-bottom: 20px;
            transition: 0.2s;
        }

        .journal-textarea:focus {
            border-color: var(--pink-main);
        }

        .btn-save-all {
            width: 100%;
            background: linear-gradient(45deg, var(--pink-main), var(--pink-accent));
            color: white;
            border: none;
            padding: 12px;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(255, 71, 126, 0.3);
            transition: all 0.2s ease;
        }

        .btn-save-all:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 71, 126, 0.4);
        }

        /* Responsive Mobile */
        @media (max-width: 600px) {
            .container {
                padding: 18px 12px;
            }
            .title {
                font-size: 1.8rem;
            }
            .day-card {
                min-height: 75px;
                padding: 4px;
            }
            .day-number {
                font-size: 0.85rem;
                width: 22px;
                height: 22px;
            }
            .day-mood {
                font-size: 1.1rem;
            }
            .task-badge {
                font-size: 0.6rem;
                padding: 1px 4px;
            }
            .calendar-weekdays {
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>

    <!-- Trang trí nền -->
    <div class="bg-decor decor-1">🌸</div>
    <div class="bg-decor decor-2">✨</div>
    <div class="bg-decor decor-3">🎀</div>
    <div class="bg-decor decor-4">🍓</div>

    <div class="container">
        <header>
            <h1 class="title">My Pink Daily Journal 💕</h1>
            <p class="subtitle">Ghi lại từng khoảnh khắc đáng yêu mỗi ngày</p>
        </header>

        <!-- Bộ điều khiển Tháng/Năm -->
        <div class="month-controls">
            <button class="month-btn" id="prevMonthBtn">❮</button>
            <div style="display: flex; align-items: center; gap: 10px;">
                <span class="month-display" id="monthYearText">Tháng 10, 2026</span>
                <button class="btn-today" id="todayBtn">Hôm nay 📍</button>
            </div>
            <button class="month-btn" id="nextMonthBtn">❯</button>
        </div>

        <!-- Thanh Thống kê Tháng -->
        <div class="stats-bar">
            <div class="stat-item">
                <span>📝 Tổng việc đã hoàn thành:</span>
                <strong id="completedTasksCount" style="color: var(--pink-accent);">0</strong>
            </div>
            <div class="stat-item">
                <span>💖 Tâm trạng nổi bật:</span>
                <span id="dominantMoodDisplay">🌸</span>
            </div>
        </div>

        <!-- Thứ trong tuần -->
        <div class="calendar-weekdays">
            <div>T2</div><div>T3</div><div>T4</div><div>T5</div><div>T6</div><div>T7</div><div>CN</div>
        </div>

        <!-- Lưới Ngày (Calendar Grid) -->
        <div class="calendar-days" id="calendarGrid"></div>
    </div>

    <!-- MODAL / POPUP CHI TIẾT NGÀY -->
    <div class="modal-overlay" id="dayModal">
        <div class="modal-card">
            <button class="close-btn" id="closeModalBtn">✕</button>
            <div class="modal-header">
                <div class="modal-date-title" id="modalDateTitle">Ngày 01 tháng 10, 2026</div>
            </div>

            <!-- Chọn Mood -->
            <div class="section-label">✨ Hôm nay bạn cảm thấy thế nào?</div>
            <div class="mood-selector" id="moodSelector">
                <button class="mood-btn" data-mood="🥰">🥰</button>
                <button class="mood-btn" data-mood="😊">😊</button>
                <button class="mood-btn" data-mood="😴">😴</button>
                <button class="mood-btn" data-mood="🥺">🥺</button>
                <button class="mood-btn" data-mood="😭">😭</button>
                <button class="mood-btn" data-mood="😡">😡</button>
            </div>

            <!-- Danh sách Hoạt động -->
            <div class="section-label">📌 Hoạt động / Công việc trong ngày</div>
            <div class="task-input-group">
                <input type="text" class="task-input" id="newTaskInput" placeholder="Thêm hoạt động mới (vd: Đi tập gym, Học TA)...">
                <button class="btn-add-task" id="addTaskBtn">Thêm</button>
            </div>
            <ul class="task-list" id="taskList"></ul>

            <!-- Nhật ký / Ghi chú -->
            <div class="section-label">📖 Nhật ký dòng tâm sự</div>
            <textarea class="journal-textarea" id="journalNote" placeholder="Viết vài dòng về ngày hôm nay của bạn..."></textarea>

            <button class="btn-save-all" id="saveDayBtn">Lưu Nhật Ký Ngày ✨</button>
        </div>
    </div>

    <script>
        // State chính của ứng dụng
        let currentDate = new Date();
        let selectedDateStr = ""; // Đinh dạng Key: YYYY-MM-DD
        
        // Dữ liệu lưu trong LocalStorage
        let appData = JSON.parse(localStorage.getItem("pink_journal_data")) || {};

        // DOM elements
        const calendarGrid = document.getElementById("calendarGrid");
        const monthYearText = document.getElementById("monthYearText");
        const prevMonthBtn = document.getElementById("prevMonthBtn");
        const nextMonthBtn = document.getElementById("nextMonthBtn");
        const todayBtn = document.getElementById("todayBtn");
        const completedTasksCount = document.getElementById("completedTasksCount");
        const dominantMoodDisplay = document.getElementById("dominantMoodDisplay");

        // Modal elements
        const dayModal = document.getElementById("dayModal");
        const closeModalBtn = document.getElementById("closeModalBtn");
        const modalDateTitle = document.getElementById("modalDateTitle");
        const moodSelector = document.getElementById("moodSelector");
        const newTaskInput = document.getElementById("newTaskInput");
        const addTaskBtn = document.getElementById("addTaskBtn");
        const taskList = document.getElementById("taskList");
        const journalNote = document.getElementById("journalNote");
        const saveDayBtn = document.getElementById("saveDayBtn");

        // Tạm lưu state của ngày đang mở trong Modal
        let activeDayData = {
            mood: "",
            tasks: [],
            note: ""
        };

        // Render Lịch tháng
        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            // Cập nhật tiêu đề Tháng/Năm
            monthYearText.textContent = `Tháng ${month + 1}, ${year}`;

            // Ngày đầu tiên của tháng và số ngày trong tháng
            const firstDayIndex = new Date(year, month, 1).getDay(); // 0 = CN, 1 = T2...
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            // Điều chỉnh để T2 là 0, CN là 6
            let adjustedFirstDay = firstDayIndex === 0 ? 6 : firstDayIndex - 1;

            calendarGrid.innerHTML = "";

            // Thêm ô trống cho các ngày thuộc tháng trước
            for (let i = 0; i < adjustedFirstDay; i++) {
                const emptyCell = document.createElement("div");
                emptyCell.className = "day-card empty";
                calendarGrid.appendChild(emptyCell);
            }

            // Tạo từng ô ngày trong tháng
            const today = new Date();
            let monthCompletedTasks = 0;
            let moodCounts = {};

            for (let day = 1; day <= daysInMonth; day++) {
                const dateKey = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const dayData = appData[dateKey] || { mood: "", tasks: [], note: "" };

                // Đếm công việc đã xong trong tháng
                const doneTasks = dayData.tasks ? dayData.tasks.filter(t => t.completed).length : 0;
                monthCompletedTasks += doneTasks;

                // Thống kê mood
                if (dayData.mood) {
                    moodCounts[dayData.mood] = (moodCounts[dayData.mood] || 0) + 1;
                }

                const dayCard = document.createElement("div");
                dayCard.className = "day-card";
                
                // Kiểm tra nếu là hôm nay
                if (today.getFullYear() === year && today.getMonth() === month && today.getDate() === day) {
                    dayCard.classList.add("today");
                }

                // Render thông tin tóm tắt trên ô ngày
                let tasksSummary = "";
                if (dayData.tasks && dayData.tasks.length > 0) {
                    tasksSummary = `<div class="task-badge">${doneTasks}/${dayData.tasks.length} việc</div>`;
                }

                dayCard.innerHTML = `
                    <div class="day-number">${day}</div>
                    <div class="day-info">
                        <div class="day-mood">${dayData.mood || ""}</div>
                        ${tasksSummary}
                    </div>
                `;

                // Sự kiện bấm vào ô ngày
                dayCard.addEventListener("click", () => openModal(dateKey, day, month + 1, year));

                calendarGrid.appendChild(dayCard);
            }

            // Cập nhật thanh thống kê
            completedTasksCount.textContent = monthCompletedTasks;
            let topMood = "🌸";
            let maxCount = 0;
            for (let m in moodCounts) {
                if (moodCounts[m] > maxCount) {
                    maxCount = moodCounts[m];
                    topMood = m;
                }
            }
            dominantMoodDisplay.textContent = topMood;
        }

        // Mở Modal chỉnh sửa ngày
        function openModal(dateKey, day, month, year) {
            selectedDateStr = dateKey;
            modalDateTitle.textContent = `Ngày ${day} tháng ${month}, ${year}`;
            
            // Lấy data cũ hoặc khởi tạo mới
            const saved = appData[dateKey] || { mood: "", tasks: [], note: "" };
            activeDayData = JSON.parse(JSON.stringify(saved)); // Deep copy

            // Reset & Fill giao diện modal
            journalNote.value = activeDayData.note || "";
            updateMoodUI(activeDayData.mood);
            renderTaskList();

            dayModal.classList.add("active");
        }

        // Đóng Modal
        function closeModal() {
            dayModal.classList.remove("active");
        }

        // Chọn Mood
        moodSelector.addEventListener("click", (e) => {
            const btn = e.target.closest(".mood-btn");
            if (!btn) return;
            const mood = btn.dataset.mood;
            activeDayData.mood = activeDayData.mood === mood ? "" : mood; // toggle select
            updateMoodUI(activeDayData.mood);
        });

        function updateMoodUI(selectedMood) {
            document.querySelectorAll(".mood-btn").forEach(btn => {
                if (btn.dataset.mood === selectedMood) {
                    btn.classList.add("selected");
                } else {
                    btn.classList.remove("selected");
                }
            });
        }

        // Render danh sách công việc trong Modal
        function renderTaskList() {
            taskList.innerHTML = "";
            if (!activeDayData.tasks) activeDayData.tasks = [];

            activeDayData.tasks.forEach((task, index) => {
                const li = document.createElement("li");
                li.className = `task-item ${task.completed ? 'completed' : ''}`;
                
                li.innerHTML = `
                    <div class="task-left">
                        <div class="checkbox-custom"></div>
                        <span>${escapeHtml(task.text)}</span>
                    </div>
                    <button class="delete-task-btn" title="Xóa">✕</button>
                `;

                // Toggle hoàn thành
                li.querySelector(".task-left").addEventListener("click", () => {
                    activeDayData.tasks[index].completed = !activeDayData.tasks[index].completed;
                    renderTaskList();
                });

                // Xóa task
                li.querySelector(".delete-task-btn").addEventListener("click", (e) => {
                    e.stopPropagation();
                    activeDayData.tasks.splice(index, 1);
                    renderTaskList();
                });

                taskList.appendChild(li);
            });
        }
